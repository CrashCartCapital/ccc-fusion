name: Full Suite (non-blocking)

# The demoted test tier (docs/plans/2026-06-04-001-refactor-fast-trusted-test-gate-plan.md).
# Runs the full sharded suite, the engine slow tier, and the dashboard
# inventory guard on every push to main — post-merge signal only. These jobs
# are NON-BLOCKING by design: they never run on PRs and must never be added
# to branch-protection required checks. A red run here is information, not a
# merge stopper; see docs/testing.md for the quarantine ratchet that keeps
# this tier honest.

on:
  push:
    branches: [main]
  # Manual re-dispatch. This tier is push-to-main-only, so a workflow-only fix
  # to it could otherwise only be exercised by landing an unrelated commit.
  # workflow_dispatch lets a maintainer re-run the tier against a known SHA and
  # re-count the failure buckets without polluting main's history.
  workflow_dispatch:

# Key the concurrency group by SHA, not ref: on push to main the ref is
# always refs/heads/main, so a ref-keyed group with cancel-in-progress would
# let consecutive merges cancel each other's runs — silently skipping the
# only coverage for everything the gate dropped. Per-SHA groups never collide.
concurrency:
  group: full-suite-${{ github.sha }}
  cancel-in-progress: false

# Least-privilege token: jobs only read the repo (checkout + cache) and upload
# workflow artifacts (timings), which needs no extra permission scope.
permissions:
  contents: read

# FN-4863: Opt JavaScript actions into Node 24 ahead of GitHub's forced cutover on 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Build the shared dist corpus once, publish it completely, then let the
  # shard matrix fan out. Four independent cold builds can exhaust the shared
  # local Docker VM before any test runs.
  prepare-test-artifacts:
    name: Prepare test artifacts
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          # This producer already publishes the dist corpus. Saving its 659 MB
          # pnpm store can exhaust the job budget on the self-hosted uplink.
          skip-install: "true"

      - name: Install dependencies without pnpm store upload
        run: pnpm install --frozen-lockfile

      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      # Versioned key forces one honest cold build after this topology change.
      # Exact-match only: partial or stale dist is worse than a clean miss.
      - name: Restore built dist artifacts
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}

      - name: Assert restored cache is complete
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: node scripts/ensure-test-artifacts.mjs --assert-artifacts-present

      - name: Seed artifact hash-cache on cache hit
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      - name: Build or validate test artifacts
        run: node scripts/ensure-test-artifacts.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=1792"

      - name: Assert prepared artifacts are complete
        run: node scripts/ensure-test-artifacts.mjs --assert-artifacts-present

      - name: Save built dist artifacts
        if: steps.dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}

  test-shards:
    name: Test shard ${{ matrix.shard }}/4
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]
    needs: prepare-test-artifacts
    # FNXC:FixPgTestsAndCi 2026-06-26-09:10:
    # Provision a PostgreSQL service container so the postgres/*.pg.test.ts
    # suites run in the non-blocking full suite too (parity with the gate).
    # The pg-test-harness probe skips gracefully if unreachable.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --memory 1g
          --cpus 1
    # Backstop for a wedged shard. The per-invocation watchdog (L2,
    # scripts/lib/run-vitest-watchdog.mjs) kills any single hung invocation at
    # its budget ceiling (<=30min), so this job budget only fires if L2 itself
    # wedges — and it must sit strictly above that ceiling so L2 fires first.
    # Without this, a hang ran to GitHub's 6h default (the silent-black-hole bug
    # this plan closes).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # All four self-hosted runners share one 8-CPU/31-GiB Docker VM. Two
      # shards at a time keeps the matrix parallel without recreating the
      # observed cross-container OOM pressure from four simultaneous shards.
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Engine tests run real git operations (merge-base against main,
          # case-variant ref checks) that require full history. Shallow
          # clones silently break tests like worktree-acquisition's resume
          # misbinding path.
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Restore the exact complete corpus published by prepare-test-artifacts.
      # A consumer miss fails instead of launching another workspace build.
      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Restore built dist artifacts
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}
          fail-on-cache-miss: true

      - name: Assert restored artifacts are complete
        run: node scripts/ensure-test-artifacts.mjs --assert-artifacts-present

      # Restored dist files carry their save-time mtimes while
      # checkout rewrites src mtimes to "now" (src newer than dist), which would
      # make ensureTestArtifacts' mtime fallback rebuild everything and defeat
      # the cache. Seed the package content hashes before the test bootstrap.
      - name: Seed artifact hash-cache
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      # The `ccc-fusion` shard containers run with no-new-privileges: there is
      # no sudo, so `apt-get` is not an option here (only the `ccc-fusion-bwrap`
      # lane used by test-slow has it). Provision the two missing interpreters
      # the userland way instead. bwrap CANNOT be provisioned on this lane at
      # all — it needs privileged setup — so the bwrap-only suites stay red here
      # until PR-B gives them an explicit named skip.
      # Why uv and not actions/setup-python: the setup-python Linux build is a
      # shared-libpython interpreter that only starts when LD_LIBRARY_PATH
      # points at its lib/ (the action exports that variable for later steps).
      # The proof adapter (templates/ccc-python-proof-adapter/verify_wrapper.py,
      # closed_runner_environment) deliberately re-spawns sys.executable with a
      # closed environment that carries no LD_LIBRARY_PATH, so every report
      # command died with exit 127 in run 34671894956 ("report command exited
      # nonzero (127)", 12 adapter tests). A uv-managed CPython is
      # self-contained (rpath-relative), so the closed re-spawn works. Same
      # mechanism the Darwin lane uses (#86); no root needed on either.
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.0"
          # No cloud cache on a self-hosted runner: the restore/save round trip
          # costs more than the install it would avoid.
          enable-cache: false

      # ccc-python-proof-adapter spawns the interpreter with PYTHONNOUSERSITE=1
      # and no PYTHONPATH, so a `--user` install is invisible to it. Install
      # pytest into the venv's own site-packages and prove the import works
      # through `python3` (the name the adapter actually resolves) with the
      # same closed environment the adapter uses.
      - name: Provision Python 3.12 and pytest with uv
        run: |
          set -euo pipefail
          uv --version
          uv python install 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/proof-venv"
          uv pip install --python "$RUNNER_TEMP/proof-venv/bin/python" pytest==8.4.2
          echo "$RUNNER_TEMP/proof-venv/bin" >> "$GITHUB_PATH"
          env -i PYTHONNOUSERSITE=1 "$RUNNER_TEMP/proof-venv/bin/python3" -c 'import pytest, sys; print("pytest", pytest.__version__, "on", sys.executable)'
        env:
          # Persist the managed interpreter in this runner's tool cache so
          # repeat runs skip the download; keep uv's own cache per run.
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache

      # Same Go Task provisioning the test-slow job uses (npm prefix into
      # RUNNER_TEMP, bin appended to GITHUB_PATH). Verifier/proof suites resolve
      # `task` from PATH; without it they fail for a toolchain reason.
      - name: Install Go Task
        run: |
          npm install -g --prefix "$RUNNER_TEMP/go-task" @go-task/cli@3.52.0
          echo "$RUNNER_TEMP/go-task/lib/node_modules/@go-task/cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go-task/lib/node_modules/@go-task/cli/bin/task" --version

      - name: Test (deterministic shard)
        run: pnpm test:ci:shard --shard ${{ matrix.shard }} --total 4
        env:
          # One package lane with one Vitest worker per active shard. With
          # matrix max-parallel=2 this bounds the shared VM to two test
          # workers plus service containers and runner overhead.
          FUSION_TEST_TOTAL_WORKERS: "1"
          FUSION_TEST_CONCURRENCY: "1"
          FUSION_PG_TEST_URL_BASE: "postgresql://postgres:postgres@host.docker.internal:${{ job.services.postgres.ports[5432] }}"
          PGPASSWORD: "postgres"

      # Each shard emits per-file vitest JSON timing reporter output under
      # .timings/. Upload as an artifact so the timing snapshot can be
      # refreshed locally/from the default branch via
      # `node scripts/ci-test-shard.mjs --write-timings`. We do NOT commit the
      # snapshot automatically — refresh is manual/scheduled only.
      - name: Upload per-shard test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-shard-${{ matrix.shard }}
          # Relative outputFile paths mean each package writes its own
          # <pkgDir>/.timings/ file — glob the whole tree, not just the root.
          path: |
            .timings/timings-*.json
            packages/*/.timings/timings-*.json
            plugins/*/.timings/timings-*.json
            plugins/examples/*/.timings/timings-*.json
          # upload-artifact v4.4.0+ excludes dot-prefixed files and directories
          # by default, and `.timings` is exactly that — so every run since has
          # uploaded nothing. `if-no-files-found: ignore` is what kept it silent
          # for months while the committed timing snapshot went stale; `warn`
          # makes the next empty upload visible in the log.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The dashboard quality gate used to enumerate its test files by hand, so any
  # unenumerated app/ or src/ test file ran in NO project. This guard fails when
  # a dashboard test file is neither executed by a quality project (curated +
  # backfill lanes) nor on the reviewed skip-list. Cheap: it only runs
  # `vitest list`, not the tests.
  test-inventory-guard:
    name: Dashboard curated-gate guard
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]
    needs: prepare-test-artifacts
    # Runs only `vitest list` (no tests execute), so this is generous headroom,
    # not a tight bound — but no CI job should be able to hang to the 6h ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Restore built dist artifacts
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}
          fail-on-cache-miss: true

      - name: Assert restored artifacts are complete
        run: node scripts/ensure-test-artifacts.mjs --assert-artifacts-present

      - name: Seed artifact hash-cache
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      - name: Assert every dashboard test file is gated or skip-listed
        run: node scripts/check-test-inventory.mjs --dashboard-curated

  line-count-audit:
    name: Line-count audit
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This audit uses Node built-ins only. The full pnpm bootstrap adds no
      # value here, and its post-job cache upload can consume the whole timeout.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      # FNXC:TestInfrastructure 2026-06-21-10:26:
      # Keep line-count drift visible in automated post-merge signal without restoring it to the blocking PR gate.
      # The guard is intentionally absent from pretest/pr-checks so task verification and merge progress are not blocked by file-size cleanup work.
      - name: Run line-count audit
        continue-on-error: true
        run: node scripts/check-file-line-count.mjs

  # The heavyweight product route and engine-slow tier run serially against one
  # disposable PostgreSQL service. Product acceptance consumes the exact built
  # proof host prepared above; slow tests retain their non-empty assertion.
  test-slow:
    name: Product route + engine slow
    # Runs the verifier-confinement readiness probe and the serialized product
    # acceptance, so it needs the bwrap-capable runner lane (see pr-checks.yml
    # gate job for the rationale).
    runs-on: [self-hosted, linux, ARM64, ccc-fusion-bwrap]
    # This host pool shares one Docker VM. Wait for every shard to release its
    # test workers and PostgreSQL service before starting the heavyweight
    # product route and engine-slow lane.
    needs: [prepare-test-artifacts, test-shards]
    # Preserve the independent product-route signal even when a shard is red,
    # while still refusing to run after cancellation or missing build output.
    if: ${{ !cancelled() && needs.prepare-test-artifacts.result == 'success' }}
    # FNXC:FixPgTestsAndCi 2026-07-14-00:00:
    # Provision a PostgreSQL service container so reliability-interaction test
    # helpers (which now require a PG-backed TaskStore after SQLite removal
    # VAL-REMOVAL-005) can run in the engine-slow tier too.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --memory 1g
          --cpus 1
    # Real-git slow suites; same backstop rationale as test-shards. Sits above
    # the L2 per-invocation ceiling so the watchdog fires first on a single hang.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Restore built dist artifacts
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-dist-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}
          fail-on-cache-miss: true

      - name: Assert restored artifacts are complete
        run: node scripts/ensure-test-artifacts.mjs --assert-artifacts-present

      - name: Seed artifact hash-cache
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      # Same toolchain contract as the pr-checks gate job: the readiness probe
      # fails closed without Go Task on PATH and bubblewrap at /usr/bin/bwrap.
      - name: Install verifier toolchain (Go Task + bubblewrap)
        run: |
          npm install -g --prefix "$RUNNER_TEMP/go-task" @go-task/cli@3.52.0
          echo "$RUNNER_TEMP/go-task/lib/node_modules/@go-task/cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go-task/lib/node_modules/@go-task/cli/bin/task" --version
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq bubblewrap
          fi
          bwrap --version

      - name: Verifier confinement readiness
        run: node scripts/check-verifier-confinement.mjs

      - name: Verify PostgreSQL service on runner host network
        id: postgres-route
        run: |
          set -euo pipefail

          postgres_port="${{ job.services.postgres.ports[5432] }}"
          if [ -z "$postgres_port" ]; then
            echo "GitHub did not expose the PostgreSQL service host port" >&2
            exit 1
          fi

          candidate_hosts=("127.0.0.1" "host.docker.internal")
          gateway_hex="$(awk '$2 == "00000000" && $3 != "00000000" { print $3; exit }' /proc/net/route)"
          if [[ "$gateway_hex" =~ ^[0-9A-Fa-f]{8}$ ]]; then
            candidate_hosts+=("$((16#${gateway_hex:6:2})).$((16#${gateway_hex:4:2})).$((16#${gateway_hex:2:2})).$((16#${gateway_hex:0:2}))")
          fi

          selected_host=""
          for candidate_host in "${candidate_hosts[@]}"; do
            if PGCONNECT_TIMEOUT=5 psql -X -w \
              "postgresql://postgres@${candidate_host}:${postgres_port}/postgres?sslmode=disable" \
              -v ON_ERROR_STOP=1 \
              -c "SELECT 1"; then
              selected_host="$candidate_host"
              break
            fi
          done

          if [ -z "$selected_host" ]; then
            echo "No reachable PostgreSQL service host candidate" >&2
            exit 1
          fi

          echo "host=${selected_host}" >> "$GITHUB_OUTPUT"
        env:
          PGPASSWORD: "postgres"

      - name: Run serialized product-route acceptance
        run: pnpm --filter @fusion/engine test:product-route
        env:
          FUSION_PG_TEST_URL_BASE: "postgresql://postgres:postgres@${{ steps.postgres-route.outputs.host }}:${{ job.services.postgres.ports[5432] }}"
          PGPASSWORD: "postgres"

      # engine-slow is a later step in the same job as product-route, so a red
      # product-route silently SKIPPED it — it has run once in a month, and
      # seven real-git merger files have had zero execution since 2026-08-11.
      # Gate on the PostgreSQL route instead of the preceding test step: this
      # lane genuinely cannot run without a reachable database, but it must not
      # inherit product-route's pass/fail. `continue-on-error` on product-route
      # would achieve the same un-skipping by destroying the product-route
      # signal, so it is deliberately NOT used. The ${{ }} wrapper is required —
      # a bare `!cancelled() && ...` is a plain string and always truthy.
      - name: Run engine-slow with non-empty-execution assertion
        if: ${{ !cancelled() && steps.postgres-route.outcome == 'success' }}
        run: node scripts/assert-engine-slow-nonempty.mjs
        env:
          FUSION_PG_TEST_URL_BASE: "postgresql://postgres:postgres@${{ steps.postgres-route.outputs.host }}:${{ job.services.postgres.ports[5432] }}"
          PGPASSWORD: "postgres"

  # ─────────────────────────────────────────────────────────────────────────
  # Why this job exists.
  #
  # The CCC semantic-v2 proof sandbox has exactly ONE backend: macOS
  # `sandbox-exec`. packages/engine/src/ccc-campaign-proof-sandbox.ts returns
  # CCC_SEMANTIC_PROOF_SANDBOX_UNAVAILABLE on every non-Darwin platform, and no
  # Linux backend has been built. Every runner in the Linux fleet therefore
  # fails these suites for a platform reason, not a product reason — 50 of the
  # 203 shard failures in the 2026-09-11 diagnosis, including the repo's only
  # end-to-end product vertical slice.
  #
  # Silently skipping them on Linux was rejected by both outside reviews: it
  # would make the tier deceptively green while deleting that slice's only
  # coverage. So the suites keep failing loudly on Linux (PR-B turns that into
  # an explicit named NOT RUN) and this native macOS lane on the M2 Max is
  # where they actually execute.
  #
  # It deliberately does NOT `needs: prepare-test-artifacts`: that job publishes
  # its dist corpus into a Linux/ARM64-keyed actions/cache on a different host
  # with a different Docker VM, so there is nothing here to consume. This lane
  # builds its own dist and provisions its own PostgreSQL. Per the M2 runner
  # standard, caches stay on the host (a local pnpm store, a pinned toolchain
  # directory) rather than round-tripping through actions/cache.
  # ─────────────────────────────────────────────────────────────────────────
  darwin-proof-lane:
    name: Darwin proof lane (M2 native)
    runs-on: [self-hosted, macOS, ARM64, ccc-fusion-darwin-proof-v1, m2max-ccc-fusion-macos-arm64-1]
    # No `needs`: independent host, independent build, independent database.
    # Still refuse to start once the run has been cancelled.
    if: ${{ !cancelled() }}
    # Real-git + sandbox-exec suites plus a cold dist build on a native host.
    # Same backstop rationale as the other heavyweight jobs: no CI job should be
    # able to run to GitHub's 6h default.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Real-git suites need full history (merge-base against main,
          # case-variant ref checks); shallow clones break them silently.
          fetch-depth: 0
          # This is a long-lived native runner, not a disposable container.
          # Do not leave the job token in the checkout's git config.
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          # skip-install also selects the setup-node variant with the pnpm
          # cloud cache disabled. This host keeps its store on local disk.
          skip-install: "true"

      - name: Install dependencies with the host-local pnpm store
        run: pnpm install --frozen-lockfile
        env:
          npm_config_store_dir: /Users/ryanpappal/ci/caches/ccc-fusion/pnpm-store

      # Go Task is pinned on the host at a versioned path rather than installed
      # per run. Several proof/verifier suites resolve `task` from PATH.
      - name: Put the pinned Go Task toolchain on PATH
        run: |
          set -euo pipefail
          echo "/Users/ryanpappal/ci/toolchains/task/3.52.0" >> "$GITHUB_PATH"
          /Users/ryanpappal/ci/toolchains/task/3.52.0/task --version

      # Same contract as the shard lane: the python proof adapter runs the
      # interpreter with PYTHONNOUSERSITE=1, so pytest must live in this
      # interpreter's own site-packages.
      - name: Setup Python for the proof adapter
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""
        env:
          # See the shard step: without this the macOS installer targets
          # /Users/runner and fails on a self-hosted runner.
          AGENT_TOOLSDIRECTORY: ${{ runner.tool_cache }}

      - name: Install pytest into the setup-python interpreter
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python3 -c 'import pytest, sys; print("pytest", pytest.__version__, "on", sys.executable)'
        env:
          PYTHONNOUSERSITE: "1"

      - name: Build test artifacts
        run: node scripts/ensure-test-artifacts.mjs

      - name: Assert prepared artifacts are complete
        run: node scripts/ensure-test-artifacts.mjs --assert-artifacts-present

      # A disposable cluster under RUNNER_TEMP, torn down in the always() step
      # at the bottom. NEVER port 5432: a live production PostgreSQL 17 runs
      # there on this host and must not be touched. The port is taken from the
      # kernel's ephemeral range and re-checked below.
      - name: Start a disposable PostgreSQL
        id: pg
        run: |
          set -euo pipefail

          PGBIN=/opt/homebrew/opt/postgresql@16/bin
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pg" -U postgres -A trust --no-locale -E UTF8

          PORT="$(node -e 'const s=require("net").createServer(); s.listen(0,"127.0.0.1",()=>{const p=s.address().port; s.close(()=>console.log(p));});')"
          if [ -z "$PORT" ] || [ "$PORT" = "5432" ]; then
            echo "refusing to use port '$PORT' (5432 is the live production server)" >&2
            exit 1
          fi
          echo "disposable PostgreSQL port: $PORT"

          # TCP-only. A Unix socket under $RUNNER_TEMP would put the socket
          # path near (or over) the 103-byte sun_path limit — verified locally:
          # "Unix-domain socket path ... is too long (maximum 103 bytes)" then
          # "FATAL: could not create any Unix-domain sockets". Nothing here
          # needs the socket: the tests connect to 127.0.0.1 over TCP,
          # pg_isready is given -h, and pg_ctl stop addresses the data dir.
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pg" \
            -o "-p $PORT -c listen_addresses=127.0.0.1 -c unix_socket_directories=" \
            -l "$RUNNER_TEMP/pg.log" start

          for _ in $(seq 1 30); do
            if "$PGBIN/pg_isready" -h 127.0.0.1 -p "$PORT" -U postgres >/dev/null 2>&1; then
              echo "port=$PORT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done

          echo "disposable PostgreSQL never became ready; server log follows" >&2
          cat "$RUNNER_TEMP/pg.log" >&2 || true
          exit 1

      - name: Run serialized product-route acceptance
        run: pnpm --filter @fusion/engine test:product-route
        env:
          FUSION_PG_TEST_URL_BASE: "postgresql://postgres:postgres@127.0.0.1:${{ steps.pg.outputs.port }}"
          PGPASSWORD: "postgres"

      # The Darwin-only proof suites, with a zero-executed assertion so a
      # glob/rename drift cannot make this lane deceptively green.
      - name: Run the Darwin-only proof suites
        if: ${{ !cancelled() && steps.pg.outcome == 'success' }}
        run: node scripts/ci-darwin-proof-lane.mjs
        env:
          FUSION_PG_TEST_URL_BASE: "postgresql://postgres:postgres@127.0.0.1:${{ steps.pg.outputs.port }}"
          PGPASSWORD: "postgres"

      - name: Stop the disposable PostgreSQL
        if: always()
        run: |
          PGBIN=/opt/homebrew/opt/postgresql@16/bin
          if [ -d "$RUNNER_TEMP/pg" ]; then
            "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pg" -m fast stop || true
          fi
