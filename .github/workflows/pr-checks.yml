name: PR Checks

# The thin trusted merge gate (docs/plans/2026-06-04-001-refactor-fast-trusted-test-gate-plan.md).
# Blocking checks are exactly: Lint, Typecheck, Build, Gate.
#
# BRANCH-PROTECTION CUTOVER: required status checks are matched by job name.
# When this file changes job names, update the repo's branch-protection
# required checks to exactly [Lint, Typecheck, Build, Gate] — a stale required
# name (e.g. "Test shard 1/4") that no longer reports will block every PR
# with "Expected — waiting for status". Open PRs must rebase onto main after
# the cutover so they run this workflow shape.
#
# Everything that used to run here as shards / slow tier / inventory guard is
# non-blocking and lives in full-suite.yml (push to main).

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: every job here only reads the repo (checkout + cache).
permissions:
  contents: read

# FN-4863: Opt JavaScript actions into Node 24 ahead of GitHub's forced cutover on 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: pnpm lint

      - name: Changeset format
        run: pnpm check:changesets

      - name: Dashboard route modularity
        run: pnpm check:routes-modular

  typecheck:
    name: Typecheck
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=1664"

  build:
    name: Build
    runs-on: [self-hosted, linux, ARM64, ccc-fusion]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # CI always runs the CLI's tsup build in "full package" mode
      # (wantsFullCliPackage() treats CI=true as an implicit --full), which
      # stages the desktop Electron runtime by spawning
      # `pnpm --filter @fusion/desktop build` as a CHILD of the still-live CLI
      # tsup process (packages/cli/tsup.config.ts
      # ensureDesktopRuntimeAssetsBuilt, invoked from its onSuccess hook).
      # Both processes inherit this job's NODE_OPTIONS and can be resident at
      # once inside the runner's 2.5 GiB container cap (whose own processes
      # already use ~640 MiB) — PR Checks run 33704433491 OOMed there with
      # "Ineffective mark-compacts near heap limit" from
      # `[desktop:build] vite build --base ./`. desktop-packaging.yml proves
      # the SAME 1664 MB cap is sufficient for this exact command run ALONE
      # (no sibling tsup process alive), so build it here as its own step
      # BEFORE `pnpm build`: ensureDesktopRuntimeAssetsBuilt() short-circuits
      # once packages/desktop/dist already exists, so the nested spawn — and
      # the two-process memory contention that caused the OOM — never
      # happens. Do NOT raise this above 1664; that is the proven-safe
      # ceiling, not an arbitrary choice.
      - name: Build desktop runtime (staged ahead of CLI full packaging)
        run: pnpm --filter @fusion/desktop build
        env:
          NODE_OPTIONS: "--max-old-space-size=1664"

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=1664"

      # Publish the complete dist set (mirrors full-suite.yml's
      # fusion-dist-v2- producer, own key prefix so the two workflows can
      # never hand each other a partial path list) so Gate below can restore
      # it instead of repeating this build. Exact-match key only, no
      # restore-keys (stale dist is the known failure mode, FN-4232/FN-4605).
      # Never node_modules.
      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Save built dist artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-pr-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}

  # The only merge-blocking TEST signal (R3). Runs the boot smoke (the app
  # starts and serves) plus the curated engine-core suite, the focused CCC PRD
  # fail-closed safety suite, and the CI-shape test — see `test:gate` in the
  # root package.json. General engine gate membership remains the explicit
  # allow-list in packages/engine/vitest.config.ts (engine-core project).
  gate:
    name: Gate
    # Gate now reuses Build's dist instead of rebuilding it: Build already runs
    # the identical `pnpm build`, and Gate's own copy of that build was ~5 of
    # its ~8 min slot time (measured run 33738197262 on 9ed3acc02). Lint and
    # Typecheck stay independent (no `needs`): they are short, and the shared
    # host-level admission service already globally serializes runner slots —
    # more `needs` edges there would only add latency without saving a
    # redundant build.
    needs: build
    # The verifier-confinement readiness probe below runs bubblewrap, which
    # needs full-capability unprivileged user namespaces. Only the dedicated
    # ccc-fusion-bwrap runner lane (container started with relaxed
    # seccomp/apparmor/systempaths so the sandbox tool itself can work)
    # provides that; the general ccc-fusion lane refuses namespace creation.
    runs-on: [self-hosted, linux, ARM64, ccc-fusion-bwrap]
    # FNXC:FixPgTestsAndCi 2026-06-26-09:10:
    # Provision a PostgreSQL service container so the postgres/*.pg.test.ts
    # suites (pgDescribe) run in the merge gate. The pg-test-harness probe
    # requires the psql client plus a successful read-only query. The service
    # uses a random host port so it cannot collide with Ryan's SSH tunnel on
    # localhost:5432.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        # Mark the service healthy only when pg_isready succeeds on the mapped
        # port, so job steps don't start before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -h localhost -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The gate's value is speed; without a job timeout a hung build or
    # deadlocked vitest worker blocks every PR for GitHub's default 6 hours.
    # Expected warm runtime is ~3-5 min, but cold or constrained self-hosted
    # runners can spend longer in dependency setup; keep a bounded backstop.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Restore the exact dist set Build's "Save built dist artifacts" step
      # just published (identical key, identical path list — including
      # packages/cli/dist, which the old Gate-only cache list omitted, so a
      # HIT here now actually makes boot-smoke's packages/cli/bin.mjs valid).
      # Exact-match key only, NO restore-keys (stale dist is the known
      # failure mode, FN-4232/FN-4605), NEVER node_modules (breaks Windows
      # pnpm junctions). Deliberately NO fail-on-cache-miss: unlike
      # full-suite.yml's shard/slow consumers, Gate keeps `pnpm build` below
      # as a graceful fallback (fast content-hash skip on a hit, full build on
      # a miss) rather than hard-failing a merge-blocking PR check on a miss.
      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Restore built dist artifacts
        id: dist-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/cli/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
            plugins/fusion-plugin-compound-engineering/dist
          key: fusion-pr-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dist-hash.outputs.hash }}

      - name: Seed artifact hash-cache on cache hit
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      # Boot smoke needs the full built workspace; a restore hit above
      # (including packages/cli/dist now) plus this graceful-fallback build
      # make this incremental-fast instead of a second full cold build.
      - name: Build
        run: pnpm build

      # The readiness probe fails closed without the verifier toolchain:
      # Go Task on PATH plus bubblewrap at a trusted path (/usr/bin/bwrap).
      # The runner image ships neither, so the job installs both.
      - name: Install verifier toolchain (Go Task + bubblewrap)
        run: |
          npm install -g --prefix "$RUNNER_TEMP/go-task" @go-task/cli@3.52.0
          echo "$RUNNER_TEMP/go-task/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go-task/bin/task" --version
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq bubblewrap
          fi
          bwrap --version

      - name: Verifier confinement readiness
        run: node scripts/check-verifier-confinement.mjs

      - name: Boot smoke (app starts and serves)
        run: node scripts/boot-smoke.mjs

      - name: Gate tests (engine-core + CCC PRD safety + CI-shape)
        run: pnpm test:gate
        env:
          # The runner itself is a Docker container. Reach the sibling
          # PostgreSQL service through its random Docker Desktop host port.
          FUSION_PG_TEST_URL_BASE: "postgresql://postgres:postgres@host.docker.internal:${{ job.services.postgres.ports[5432] }}"
          PGPASSWORD: "postgres"

  # Advisory desktop-packaging validation lives in its OWN workflow (desktop-packaging.yml) so this
  # thin gate stays exactly [Lint, Typecheck, Build, Gate] — the job set here maps 1:1 to the
  # branch-protection required checks (CI-shape test enforces the invariant).
