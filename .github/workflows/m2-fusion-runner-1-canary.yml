name: M2 Fusion Runner 1 Canary

on:
  push:
    branches:
      - codex/m2-fusion-runner-1-canary-20260822

permissions:
  contents: read

jobs:
  exact-runner-canary:
    name: Exact M2 Fusion runner 1 canary
    runs-on: [self-hosted, Linux, ARM64, ccc-fusion, m2max-fusion-arm64-1]
    timeout-minutes: 10
    steps:
      - name: Hold admission lease for controller proof
        shell: bash
        run: sleep 45
      - name: Prove exact runtime and Docker tooling
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "m2max-fusion-arm64-1"
          test "$(uname -m)" = "aarch64"
          test "$(docker version --format '{{.Client.Version}}|{{.Server.Version}}')" = "29.1.3|29.5.2"
          psql --version
          /opt/actions-runner/externals/node24/bin/node --version
          test -r /opt/ci-admission/config
