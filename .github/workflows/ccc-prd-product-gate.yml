name: CCC PRD Product Acceptance (non-blocking)

# Wires `pnpm verify:ccc-prd-product` (scripts/ccc-prd-product-acceptance.mjs)
# into CI so the canonical product acceptance ledger runs on every PR instead
# of only locally/manually. This is a NEW, separate workflow — it does not
# touch pr-checks.yml's required job set (Lint, Typecheck, Build, Gate), so
# this job is automatically NOT a required status check. Branch protection is
# untouched; a red run here is information, not a merge stopper.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ccc-prd-product-gate-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this job only reads the repo (checkout + cache).
permissions:
  contents: read

# FN-4863: Opt JavaScript actions into Node 24 ahead of GitHub's forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  product-acceptance:
    name: CCC PRD product acceptance
    # The acceptance script drives the built CLI through real worktree/task
    # lifecycle, which runs admitted requirement verifiers under confinement
    # (bubblewrap on Linux, mirroring the PR-gate Gate job's rationale in
    # pr-checks.yml). Only the dedicated ccc-fusion-bwrap lane provides the
    # unprivileged user-namespace capability bwrap needs.
    runs-on: [self-hosted, linux, ARM64, ccc-fusion-bwrap]
    # The script asserts a clean, unchanged repository status before and
    # after it runs (CCC_PRODUCT_REPOSITORY_DIRTY / _DRIFT) and does real git
    # operations (worktrees, merge-base checks), so a full clone is required.
    #
    # No postgres service here: unlike pgDescribe-gated real-pg tests, this
    # script never reads FUSION_PG_TEST_URL_BASE / DATABASE_URL (it strips
    # DATABASE_URL from the child env it hands the CLI-under-test) and always
    # drives the CLI's own bundled embedded PostgreSQL. Confirmed by a full
    # local run of `pnpm verify:ccc-prd-product` completing PASS end-to-end
    # (all ~30 checks) with no external Postgres present.
    #
    # The script runs ~30 acceptance checks end-to-end (build, freeze, author,
    # execute, land) with per-command timeouts up to 3 minutes; give it
    # generous headroom above the observed local runtime.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Dist-artifact cache (same contract as pr-checks.yml's Gate job):
      # exact-match key only, NO restore-keys (stale dist is the known
      # failure mode, FN-4232/FN-4605), NEVER node_modules (breaks Windows
      # pnpm junctions elsewhere). The acceptance script rebuilds its own
      # workspaces internally, but the verifier-confinement readiness probe
      # below needs packages/engine/dist built first.
      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Cache built dist artifacts
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
          key: dist-${{ runner.os }}-${{ steps.dist-hash.outputs.hash }}

      - name: Seed artifact hash-cache on cache hit
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      - name: Build
        run: pnpm build

      # Same toolchain contract as pr-checks.yml's Gate job: the readiness
      # probe fails closed without Go Task on PATH and bubblewrap at a
      # trusted path (/usr/bin/bwrap). The runner image ships neither.
      - name: Install verifier toolchain (Go Task + bubblewrap)
        run: |
          npm install -g --prefix "$RUNNER_TEMP/go-task" @go-task/cli@3.52.0
          echo "$RUNNER_TEMP/go-task/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go-task/bin/task" --version
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq bubblewrap
          fi
          bwrap --version

      - name: Verifier confinement readiness
        run: node scripts/check-verifier-confinement.mjs

      # FUSION_PRODUCT_TIMEOUT_MS overrides the script's internal poll
      # timeout (scripts/ccc-prd-product-acceptance.mjs:66, default 120_000,
      # unchanged for local/dev use). This runner is slower than the dev
      # hardware that default was calibrated on: two isolated runs (no other
      # bwrap-lane job active either time) both hit
      # CCC_PRODUCT_POLL_TIMEOUT: verifier process reached post-dispatch
      # cutpoint at the 120s mark --
      # https://github.com/CrashCartCapital/ccc-fusion/actions/runs/30856906922/job/91829936007
      # and job 91841475110 on the same run (rerun attempt). 600s still stays
      # well inside the job's own 45-minute timeout-minutes backstop above.
      - name: CCC PRD product acceptance gate
        run: pnpm verify:ccc-prd-product
        env:
          FUSION_PRODUCT_TIMEOUT_MS: "600000"
