name: CCC PRD Product Acceptance (non-blocking)

# Wires `pnpm verify:ccc-prd-product` (scripts/ccc-prd-product-acceptance.mjs)
# into CI so the canonical product acceptance ledger can run on demand instead
# of only locally/manually. This is a NEW, separate workflow — it does not
# touch pr-checks.yml's required job set (Lint, Typecheck, Build, Gate), so
# this job is not and never was a required status check.
#
# DISPATCH-ONLY, NOT wired to pull_request: the root cause is now diagnosed,
# not flake or job contention. The CCC semantic-v2 proof sandbox
# (packages/engine/src/ccc-campaign-proof-sandbox.ts) has exactly one
# execution backend — macOS `sandbox-exec` — and no Linux implementation has
# ever existed (true since the file's first commit, d12614d53, 2026-08-13; an
# original limitation, not a regression). On this job's runner (self-hosted
# linux ARM64 ccc-fusion-bwrap) the semantic-proof sandbox preflight throws
# immediately, the verifier subprocess the acceptance script's marker-poll
# waits on is therefore never spawned, and the poll stalls until timeout
# instead of failing with the real cause. Three runs on this runner all hit
# the identical signature, ruling out flake:
#   - https://github.com/CrashCartCapital/ccc-fusion/actions/runs/30856906922/job/91829936007
#     (120s default poll timeout)
#   - job 91841475110, same run (rerun attempt, runner exclusive, 120s)
#   - https://github.com/CrashCartCapital/ccc-fusion/actions/runs/30861839426/job/91845282837
#     (600s override via FUSION_PRODUCT_TIMEOUT_MS below -- ran far longer and
#     still failed identically, ruling out "needs more time")
#
# Full finding, evidence trail, and the tracked plan to add a Linux
# (bubblewrap) backend: docs/plans/2026-09-03-semantic-proof-sandbox-linux-gap.md
#
# The job below now fails fast with a named cause on any non-Darwin runner
# (see the "Refuse non-Darwin runners" guard step) instead of appearing to
# test something it structurally cannot and then stalling for the full poll
# timeout. This workflow stays workflow_dispatch-only, and stays in the repo
# unremoved, as the place the gate will run once a Linux semantic-proof
# sandbox backend lands — it must keep working unmodified if this fleet ever
# gains a Darwin runner.

on:
  workflow_dispatch: {}

concurrency:
  group: ccc-prd-product-gate-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this job only reads the repo (checkout + cache).
permissions:
  contents: read

# FN-4863: Opt JavaScript actions into Node 24 ahead of GitHub's forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  product-acceptance:
    name: CCC PRD product acceptance
    # The acceptance script drives the built CLI through real worktree/task
    # lifecycle, which runs admitted requirement verifiers under confinement
    # (bubblewrap on Linux, mirroring the PR-gate Gate job's rationale in
    # pr-checks.yml). Only the dedicated ccc-fusion-bwrap lane provides the
    # unprivileged user-namespace capability bwrap needs.
    runs-on: [self-hosted, linux, ARM64, ccc-fusion-bwrap]
    # The script asserts a clean, unchanged repository status before and
    # after it runs (CCC_PRODUCT_REPOSITORY_DIRTY / _DRIFT) and does real git
    # operations (worktrees, merge-base checks), so a full clone is required.
    #
    # No postgres service here: unlike pgDescribe-gated real-pg tests, this
    # script never reads FUSION_PG_TEST_URL_BASE / DATABASE_URL (it strips
    # DATABASE_URL from the child env it hands the CLI-under-test) and always
    # drives the CLI's own bundled embedded PostgreSQL. Confirmed by a full
    # local run of `pnpm verify:ccc-prd-product` completing PASS end-to-end
    # (all ~30 checks) with no external Postgres present.
    #
    # The script runs ~30 acceptance checks end-to-end (build, freeze, author,
    # execute, land) with per-command timeouts up to 3 minutes; give it
    # generous headroom above the observed local runtime.
    timeout-minutes: 45
    steps:
      # Fails in seconds with the real, named cause instead of letting the
      # acceptance script poll to its ~12-minute timeout and report a
      # misleading "poll timeout" that reads like a hung verifier. Runs
      # before checkout because the runner's platform is already knowable
      # from `runner.os`, and this must fail as fast as possible.
      - name: Refuse non-Darwin runners (no Linux semantic-proof sandbox backend)
        if: runner.os != 'macOS'
        run: |
          {
            echo "::error::CCC PRD product acceptance cannot pass on this runner (runner.os=${{ runner.os }})."
            echo "::error::The CCC semantic-proof sandbox (packages/engine/src/ccc-campaign-proof-sandbox.ts) has exactly one execution backend: macOS sandbox-exec. No Linux backend exists yet, so the verifier subprocess this gate's marker-poll waits on is never spawned."
            echo "::error::Without this guard, the acceptance script would instead poll to its timeout and report a misleading poll-timeout failure that looks like a hung verifier."
            echo "::error::See docs/plans/2026-09-03-semantic-proof-sandbox-linux-gap.md for the full finding and the tracked plan to add a Linux (bubblewrap) backend."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Dist-artifact cache (same contract as pr-checks.yml's Gate job):
      # exact-match key only, NO restore-keys (stale dist is the known
      # failure mode, FN-4232/FN-4605), NEVER node_modules (breaks Windows
      # pnpm junctions elsewhere). The acceptance script rebuilds its own
      # workspaces internally, but the verifier-confinement readiness probe
      # below needs packages/engine/dist built first.
      - name: Compute dist source hash
        id: dist-hash
        run: echo "hash=$(node scripts/ensure-test-artifacts.mjs --print-source-hash)" >> "$GITHUB_OUTPUT"

      - name: Cache built dist artifacts
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/core/dist
            packages/dashboard/dist
            packages/engine/dist
            packages/plugin-sdk/dist
            plugins/fusion-plugin-dependency-graph/dist
            plugins/fusion-plugin-hermes-runtime/dist
            plugins/fusion-plugin-openclaw-runtime/dist
            plugins/fusion-plugin-paperclip-runtime/dist
          key: dist-${{ runner.os }}-${{ steps.dist-hash.outputs.hash }}

      - name: Seed artifact hash-cache on cache hit
        if: steps.dist-cache.outputs.cache-hit == 'true'
        run: node scripts/ensure-test-artifacts.mjs --seed-artifact-cache

      - name: Build
        run: pnpm build

      # Same toolchain contract as pr-checks.yml's Gate job: the readiness
      # probe fails closed without Go Task on PATH and bubblewrap at a
      # trusted path (/usr/bin/bwrap). The runner image ships neither.
      - name: Install verifier toolchain (Go Task + bubblewrap)
        run: |
          npm install -g --prefix "$RUNNER_TEMP/go-task" @go-task/cli@3.52.0
          echo "$RUNNER_TEMP/go-task/lib/node_modules/@go-task/cli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/go-task/lib/node_modules/@go-task/cli/bin/task" --version
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq bubblewrap
          fi
          bwrap --version

      - name: Verifier confinement readiness
        run: node scripts/check-verifier-confinement.mjs

      # FUSION_PRODUCT_TIMEOUT_MS overrides the script's internal poll
      # timeout (scripts/ccc-prd-product-acceptance.mjs:66, default 120_000,
      # unchanged for local/dev use). Raised here to rule out "needs more
      # time" before concluding functional failure -- see the three-run
      # evidence trail in this file's header. 600s still stays well inside
      # the job's own 45-minute timeout-minutes backstop above, and still
      # fails identically, so this knob is not (by itself) the fix.
      - name: CCC PRD product acceptance gate
        run: pnpm verify:ccc-prd-product
        env:
          FUSION_PRODUCT_TIMEOUT_MS: "600000"
